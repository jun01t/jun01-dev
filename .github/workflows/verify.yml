name: Verify desk
on:
  pull_request:
  push:
    branches:
      - 'codex/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE: /jun01-dev/
          SITE_URL: https://jun01t.github.io/jun01-dev/
